<!DOCTYPE html>

<style>
        body { background-color: #FAF9F6; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-card-shadow {
        box-shadow: 0 4px 20px 0 rgba(99, 14, 212, 0.05);
}
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col items-center font-body-md text-on-surface">
<main class="w-full max-w-md mx-auto px-container-margin py-xl flex flex-col gap-lg">
<!-- Welcome Illustration Section -->
<div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A warm and welcoming high-key digital illustration of a diverse group of students sitting comfortably in a bright, minimalist modern lounge. The lighting is soft and diffused, creating a serene and supportive atmosphere with a color palette dominated by warm off-whites, soft creams, and vibrant accents of electric violet. The scene conveys a sense of calm career exploration and collective momentum, with clean lines and generous negative space following a tactile minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLf1zhpOhl-6y6eYUtpdI2Fsv5pszR2wh_7RQ55sW98W1GdAHVU-G8oKMoLg9wNkTr93QgMOuV3hkW3Y3AEgBm8iXSv0QGyKgiRzYZU4a3sYac92YDDvrfJVDa45plWQioj54wORGowfBXyDZmAQzlsI9XeHAce4MiQ1_J2f6eWf7BFC35cFM6XJAlZvGawPdE54uo5h6NghGLP52bVYm3bBH-8pSDZnlhmJn1kUbiNL1lr-wauGuRA7XbnX7r1nVZl4BpVWznbCY"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/60 to-transparent"></div>
</div>
<!-- Typography Header -->
<div class="flex flex-col gap-base text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">
                Bem-vindo à sua jornada de autodescoberta
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-sm">
                O SyncCarreira ajuda você a encontrar seu caminho profissional com calma e segurança.
            </p>
</div>
<!-- Onboarding Form -->
<div class="bg-surface-container-lowest p-lg rounded-[32px] shadow-[0_20px_40px_-15px_rgba(99,14,212,0.08)] border border-outline-variant/30 flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-outline px-xs">Como gostaria de ser chamado?</label>
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-2xl py-4 px-md font-body-md transition-all duration-200" placeholder="Seu nome ou apelido" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-outline px-xs">Sua data de nascimento</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-2xl py-4 px-md font-body-md transition-all duration-200" type="date"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-outline px-xs">Qual sua maior dúvida hoje?</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-2xl py-4 px-md font-body-md transition-all duration-200 cursor-pointer">
<option disabled="" selected="" value="">Selecione um tema</option>
<option value="carreira">Carreira</option>
<option value="enem">Enem</option>
<option value="faculdade">Faculdade</option>
<option value="estagios">Estágios</option>
<option value="outros">Outros</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Primary Action Button -->
<button class="mt-base w-full h-[56px] bg-primary text-on-primary font-headline-md text-headline-md rounded-2xl shadow-[0_8px_16px_-4px_rgba(99,14,212,0.3)] hover:opacity-90 active:scale-95 transition-all duration-200 border-b-4 border-on-primary-fixed-variant">
                Começar minha jornada
            </button>
<!-- Secondary Visual Cue -->
<div class="flex items-center justify-center gap-xs pt-xs">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
</div>
</div>
<!-- Footer Text -->
<footer class="text-center pb-xl">
<p class="font-label-caps text-label-caps text-outline">
                Sua privacidade é nossa prioridade. 
                <br/>
<span class="text-primary cursor-pointer hover:underline">Saiba mais sobre nossos termos.</span>
</p>
</footer>
</main>
<!-- Background Decoration Elements -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-secondary-container/10 blur-[100px] rounded-full"></div>
<div class="fixed bottom-0 left-0 -z-10 w-96 h-96 bg-primary-fixed/20 blur-[120px] rounded-full"></div>
