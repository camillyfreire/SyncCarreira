<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF9F6;
        }
        .likert-glow:checked + label {
            box-shadow: 0 0 0 2px #630ed4, 0 0 20px rgba(124, 58, 237, 0.15);
            background-color: #630ed4;
            color: white;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#fcf2eb",
                      "background": "#fff8f5",
                      "secondary-container": "#62fae3",
                      "on-primary-fixed-variant": "#5a00c6",
                      "outline": "#7b7487",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#732ee4",
                      "on-surface": "#1f1b17",
                      "primary": "#630ed4",
                      "tertiary": "#7c3d00",
                      "on-secondary-fixed-variant": "#005047",
                      "error-container": "#ffdad6",
                      "tertiary-container": "#a05100",
                      "surface": "#fff8f5",
                      "surface-variant": "#eae1da",
                      "on-primary-fixed": "#25005a",
                      "error": "#ba1a1a",
                      "surface-bright": "#fff8f5",
                      "on-secondary-fixed": "#00201c",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#ede0ff",
                      "inverse-surface": "#342f2b",
                      "on-background": "#1f1b17",
                      "surface-container": "#f6ece6",
                      "surface-dim": "#e2d8d2",
                      "on-surface-variant": "#4a4455",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#62fae3",
                      "primary-fixed": "#eaddff",
                      "primary-fixed-dim": "#d2bbff",
                      "tertiary-fixed": "#ffdcc5",
                      "tertiary-fixed-dim": "#ffb783",
                      "on-tertiary-fixed": "#301400",
                      "primary-container": "#7c3aed",
                      "on-error": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-container-high": "#f0e6e0",
                      "outline-variant": "#ccc3d8",
                      "inverse-primary": "#d2bbff",
                      "inverse-on-surface": "#f9efe8",
                      "on-error-container": "#93000a",
                      "on-secondary-container": "#007165",
                      "on-tertiary-fixed-variant": "#713700",
                      "surface-container-highest": "#eae1da",
                      "secondary-fixed-dim": "#3cddc7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "32px",
                      "gutter": "16px",
                      "xs": "4px",
                      "md": "20px",
                      "container-margin": "20px",
                      "base": "8px",
                      "sm": "12px",
                      "xl": "48px"
              },
              "fontFamily": {
                      "headline-md": ["Plus Jakarta Sans"],
                      "body-md": ["Inter"],
                      "title-sm": ["Plus Jakarta Sans"],
                      "label-caps": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "title-sm": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "display-lg": ["36px", {"lineHeight": "1.2", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#FAF9F6] text-on-surface min-h-screen flex flex-col">
<!-- Top AppBar (Back Action Only) -->
<header class="flex justify-between items-center w-full px-5 py-4 bg-[#FAF9F6] sticky top-0 z-50">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">TRILHA DE AUTOCONHECIMENTO</span>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Progress Indicator Container -->
<div class="px-container-margin mt-2">
<div class="flex justify-between items-end mb-2">
<span class="font-title-sm text-title-sm text-primary">Pergunta 3</span>
<span class="font-body-md text-body-md text-on-surface-variant">de 10</span>
</div>
<div class="h-2 w-full bg-[#E6E4E0] rounded-full overflow-hidden">
<div class="h-full bg-primary w-[30%] rounded-full"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin flex flex-col justify-center py-lg">
<!-- Question Card -->
<div class="bg-white rounded-[32px] p-8 border border-[#E6E4E0] shadow-[0_20px_40px_rgba(0,0,0,0.03)] relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-[100%] -mr-16 -mt-16"></div>
<div class="relative z-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xl text-center">
                    O quanto você se sente confortável liderando um grupo em uma atividade escolar?
                </h1>
<!-- Likert Scale -->
<div class="flex flex-col gap-6 mb-xl">
<div class="flex justify-between items-center px-2">
<span class="font-label-caps text-[10px] text-on-surface-variant max-w-[80px] text-center">Nada confortável</span>
<span class="font-label-caps text-[10px] text-on-surface-variant max-w-[80px] text-center">Totalmente confortável</span>
</div>
<div class="flex justify-between items-center relative">
<!-- Connecting Line -->
<div class="absolute h-[2px] bg-[#E6E4E0] left-6 right-6 top-1/2 -translate-y-1/2 z-0"></div>
<!-- Buttons -->
<div class="relative z-10 flex justify-between w-full">
<input class="hidden likert-glow" id="l1" name="likert" type="radio"/>
<label class="w-12 h-12 rounded-full border-2 border-[#E6E4E0] bg-white flex items-center justify-center font-bold text-on-surface-variant cursor-pointer transition-all hover:border-primary active:scale-90" for="l1">1</label>
<input class="hidden likert-glow" id="l2" name="likert" type="radio"/>
<label class="w-12 h-12 rounded-full border-2 border-[#E6E4E0] bg-white flex items-center justify-center font-bold text-on-surface-variant cursor-pointer transition-all hover:border-primary active:scale-90" for="l2">2</label>
<input class="hidden likert-glow" id="l3" name="likert" type="radio"/>
<label class="w-12 h-12 rounded-full border-2 border-[#E6E4E0] bg-white flex items-center justify-center font-bold text-on-surface-variant cursor-pointer transition-all hover:border-primary active:scale-90" for="l3">3</label>
<input class="hidden likert-glow" id="l4" name="likert" type="radio"/>
<label class="w-12 h-12 rounded-full border-2 border-[#E6E4E0] bg-white flex items-center justify-center font-bold text-on-surface-variant cursor-pointer transition-all hover:border-primary active:scale-90" for="l4">4</label>
<input class="hidden likert-glow" id="l5" name="likert" type="radio"/>
<label class="w-12 h-12 rounded-full border-2 border-[#E6E4E0] bg-white flex items-center justify-center font-bold text-on-surface-variant cursor-pointer transition-all hover:border-primary active:scale-90" for="l5">5</label>
</div>
</div>
</div>
<!-- Observation Field -->
<div class="mt-8">
<label class="block font-title-sm text-body-md text-on-surface mb-2" for="comment">Quer comentar algo sobre essa resposta?</label>
<textarea class="w-full bg-[#FAF9F6] border-none rounded-2xl p-4 focus:ring-2 focus:ring-primary font-body-md text-on-surface placeholder-on-surface-variant/50" id="comment" placeholder="Sua observação (opcional)" rows="3"></textarea>
</div>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-container-margin pb-xl flex flex-col gap-4">
<button class="w-full h-[56px] bg-primary text-white rounded-2xl font-bold font-title-sm shadow-[0_4px_0_0_#4c0bad] active:translate-y-[2px] active:shadow-none transition-all flex items-center justify-center gap-2">
            Próxima
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full py-3 text-on-surface-variant font-medium font-body-md hover:text-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
            Preciso de ajuda
        </button>
</footer>
<!-- Background Decoration -->
<div class="fixed bottom-0 right-0 -z-10 opacity-20 pointer-events-none">
<div class="w-96 h-96 rounded-full bg-gradient-to-tr from-primary/30 to-secondary-container/20 blur-3xl"></div>
</div>
</body></html>
