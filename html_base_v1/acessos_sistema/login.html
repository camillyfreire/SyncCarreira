</div>

<input class="w-full bg-[#FAF9F6] border-transparent focus:border-primary focus:ring-0 rounded-lg p-md text-body-lg font-body-lg transition-all outline-none border-2" id="email" placeholder="seu@email.com" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">SENHA</label>
<input class="w-full bg-[#FAF9F6] border-transparent focus:border-primary focus:ring-0 rounded-lg p-md text-body-lg font-body-lg transition-all outline-none border-2" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary-container" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar de mim</span>
</label>
<a class="font-body-md text-body-md text-primary font-semibold hover:underline" href="#">Esqueceu a senha?</a>
</div>
<button class="w-full h-[56px] bg-primary text-on-primary font-title-sm text-title-sm rounded-lg tactile-button flex items-center justify-center transition-all" type="submit">
                        Entrar
                    </button>
</form>

<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center text-label-caps">
